[package]
name = "sonidos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SesoLibre Sonidos: receta + semilla → audio. Sin UI, sin plataforma."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = { version = "3.5", optional = true }
lewton = { version = "0.10", optional = true }

[features]
default = ["wav", "ogg"]
wav = ["hound"]
ogg = ["lewton"]
